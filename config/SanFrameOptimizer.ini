; SanFrame Optimizer - GTA San Andreas Classic PC US 1.0 (Win32)
; 1 = enabled, 0 = disabled unless noted. Restart the game after changes.

[Main]
Enabled=1

[Rendering]
; VSync: Game | On | Off.
VSync=Game

[Optimization]
Enabled=1

D3DStateDeduplication=1
D3DStateAdaptive=1
D3DStateAdaptiveWarmupPresents=1800
D3DStateAdaptiveMinimumCalls=50000
D3DStateAdaptiveMaxPresents=12000
D3DStateAdaptiveMinSkipPercent=5
D3DStateAdaptiveResampleInterval=3600
D3DStateAdaptiveResampleWindow=300
D3DStateTimeSampling=0
D3DStateTimeWindow=300
D3DStateInvalidateOnPresent=1
D3DStateDisableOnMultithreadedDevice=1
D3DStateStatsLogEveryNFrames=0

D3DOptimizeRenderState=1
D3DOptimizeTexture=1
D3DOptimizeSamplerState=1
D3DOptimizeTextureStageState=1
D3DOptimizeFVF=1
D3DOptimizeShaders=1
D3DOptimizeVertexDeclaration=1
D3DOptimizeStreamSource=1
D3DOptimizeIndices=1
D3DOptimizeShaderConstants=1
D3DOptimizeTransform=1
D3DOptimizeViewport=1
D3DOptimizeScissorRect=1
D3DOptimizeRenderTarget=1
D3DOptimizeDepthStencil=1
D3DOptimizeMaterial=1
D3DOptimizeLight=1
D3DOptimizeLightEnable=1
D3DOptimizeClipPlane=1
D3DOptimizeNPatchMode=1

RenderWareBatching=1
RenderWareDayNightBatching=1
RenderWarePlanCache=1
ImmediateBatching=1
StaticPropInstancing=1
AdaptiveBatching=1
AdaptiveBatchWindow=600
AdaptiveBatchProbe=240

SkygfxShaderConstantOptimization=1
SkygfxShaderBindingOptimization=1
SkygfxPassProfiling=0

VisibilityBoundsCache=1

; Experimental alpha/shadow indexing; verify visual correctness in game.
AlphaListIndex=0
ShadowGroupIndex=0

; Current gameplay paths enqueue no preparation jobs or scratch allocations.
WorkerPreparation=0
WorkerThreads=1
TransientArena=0

; Report interval in frames; 0 disables periodic reports.
OptimizationLogInterval=0
PassTiming=0

[FXP]
Enabled=1
ReplaceSimulation=1
CompiledCurves=1
MatrixCache=1

; Experimental operator caches/plans may change floating-point rounding.
OperatorCache=0
OperatorPlans=0

; Experimental particle instancing; enable after checking renderer compatibility.
InstancedSubmission=0

Profile=0
StatsIntervalSeconds=0

[Performance]
FrameLimiter=0
TargetFPS=60.0
BackgroundFPS=30.0
LimitPoint=BeforePresent
LatencyProfile=LowLatency

HighResolutionTimer=1
BusyWaitMicroseconds=350
MMCSS=1
TimerResolution1ms=0
MaxCatchUpFrames=2

MaxRenderAheadFrames=1

; VRR: Off | Auto | On. Auto adjusts the cap with VSync=Off.
VRRMode=Auto
VRRRefreshMarginHz=3.0
VRRMinimumRefreshHz=75.0

; D3D9Ex: Off | Auto | Force.
D3D9Ex=Off

FrameStats=0
FrameStatsIntervalMs=5000
DeviceLossTelemetry=1
DeviceStatePollMs=250

[DXVK]
; Stock DXVK only; ReFX retains ownership of its settings.
AutoTune=1
; -1 uses Performance.MaxRenderAheadFrames.
MaxFrameLatency=-1
MatchVSyncPolicy=1

DisableInternalLimiterWhenSanFrameLimiter=1
DisableLatencySleepWhenSanFrameLimiter=1

ProperShadersResetWorkaround=1

UseAllCompilerThreads=1
ForceDeviceLocalConstantBuffers=1
DisableFileLogging=1
UseLocalShaderCache=1

[Compatibility]
; DistantStreaming auto-selects Present-only; 1 forces it for renamed/conflicting ASIs.
OverlayPresentOnly=0

[Overlay]
Enabled=1

ShowTitle=1
ShowAPI=1
ShowGPU=1
ShowGPUMemory=1
ShowSharedGPUMemory=1
ShowFPS=1
ShowFrameTime=1
ShowResolution=1
ShowStreamingMemory=1
ShowCache64Memory=1
ShowClock=1
ShowDate=1
ShowSeconds=1

ShowCPUUsage=0
ShowGPUUsage=0
ShowProcessCPUUsage=0
ShowThreadUsage=0
ShowThreadMode=0
ShowOptimizationStatus=0
ShowDrawCalls=0
ShowPrimitives=0

; Position uses 1080p-reference pixels.
Alignment=TopLeft
PositionX=12
PositionY=12

; ScaleMode: Auto | Manual | DPIOnly | ResolutionOnly.
ScaleMode=Auto
Scale=0.85
ManualScale=2.00
MinScale=1.00
MaxScale=4.00
ReferenceHeight=1080
UseDPIScale=1
UseResolutionScale=1
UsePresentationScale=1
DynamicDPI=1
FontSize=18.0

; TextEffect: None | Shadow | Outline.
TextEffect=Shadow
ShadowOffsetX=2
ShadowOffsetY=2
OutlineThickness=2

; Colors: RGB 0..255, alpha 0..1.
TextR=250
TextG=250
TextB=250
TextAlpha=1.00
EffectR=0
EffectG=0
EffectB=0
EffectAlpha=0.90

[Debug]
VerboseLogging=0
IniDiagnostics=0
RuntimeReportIntervalSeconds=0
